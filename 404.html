<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found — Vurb</title>
  <meta name="robots" content="noindex">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("theme"); } catch (e) {}
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>
  <!-- GitHub Pages serves this file for any missing path, so everything is root-relative. -->
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <script src="/layout.js"></script>
  <main id="main">
    <section class="not-found">
      <div class="container">
        <img src="/assets/logo.svg" alt="" width="160" height="160">
        <h1>We couldn't find that page.</h1>
        <p class="lede">The link may be old, or the page may have moved. These are the ones people usually want:</p>
        <ul>
          <li><a class="btn" href="/">Go to the home page</a></li>
          <li><a href="/download.html">Download</a></li>
          <li><a href="/pricing.html">Pricing</a></li>
          <li><a href="/faq.html">FAQ</a></li>
          <li><a href="/support.html">Support</a></li>
        </ul>
      </div>
    </section>
  </main>
  <script src="/config.js"></script>
  <script src="/main.js"></script>
</body>
</html>
